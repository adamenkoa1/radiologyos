name: Prepare 0097 service lineage

on:
  push:
    branches: [feature/service-delivery-appointment-lineage]

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/service-delivery-appointment-lineage
          fetch-depth: 0

      - name: Update behavioral contracts and Drizzle metadata
        run: |
          python - <<'PY'
          import json, time, uuid
          from pathlib import Path

          # Appointment registrar: completion now hands execution to the posted Appointment.
          p = Path('tests/appointment-registrar.behavior.test.mjs')
          s = p.read_text()
          old = '''  assert.equal(service.basisDocumentId,orderFor(raw,1,completedId).id,"0095 must not change service-delivery Patient Order basis");'''
          new = '''  assert.equal(service.basisDocumentId,completed[0].id,"0097 must base execution on the posted Appointment");'''
          assert s.count(old) == 1, s.count(old)
          p.write_text(s.replace(old,new))

          # Patient Order tests: commercial finance stays rooted in the order, execution traverses Appointment.
          p = Path('tests/patient-order-root.behavior.test.mjs')
          s = p.read_text()
          marker = '''\nasync function pay(db,cookie,bookingId,reference="ORDER-PAY"){'''
          helper = '''\nfunction appointmentFor(raw,organizationId,bookingId){\n  return raw.prepare(\n    `SELECT d.id,d.state,a.appointment_version AS version\n     FROM appointment_details a\n     JOIN business_documents d ON d.id=a.document_id AND d.organization_id=a.organization_id\n     WHERE a.organization_id=? AND a.booking_id=? AND d.document_type='appointment' AND d.state='posted'\n     ORDER BY a.appointment_version DESC LIMIT 1`\n  ).get(organizationId,bookingId);\n}\n'''
          assert s.count(marker) == 1
          assert 'function appointmentFor(' not in s
          s = s.replace(marker, helper + marker)

          s = s.replace(
            'test("study completion posts the Patient Order first and service delivery is based on that root",async()=>{',
            'test("study completion posts the Patient Order and routes execution through the posted Appointment",async()=>{'
          )
          old = '''    assert.equal(service.state,"posted");\n    assert.equal(service.basisDocumentId,order.id);\n    assert.match(service.number,/^НП-\\d{6}$/);'''
          new = '''    assert.equal(service.state,"posted");\n    const appointment=appointmentFor(raw,1,bookingId); assert.ok(appointment?.id>0);\n    assert.equal(service.basisDocumentId,appointment.id);\n    assert.notEqual(service.basisDocumentId,order.id);\n    assert.match(service.number,/^НП-\\d{6}$/);'''
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old,new)

          old = '''    assert.equal(service.basisDocumentId,order.id);\n\n    const stornoResponse=await storno(db,cookie,service.id);'''
          new = '''    const appointment=appointmentFor(raw,1,bookingId); assert.ok(appointment?.id>0);\n    assert.equal(service.basisDocumentId,appointment.id);\n\n    const stornoResponse=await storno(db,cookie,service.id);'''
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old,new)

          s = s.replace(
            'test("unified document structure exposes Patient Order -> payment/service -> refund/storno chain",async()=>{',
            'test("unified document structure exposes Patient Order -> Appointment -> service while finance stays rooted in the order",async()=>{'
          )
          old = '''    const stornoResponse=await storno(db,cookie,service.id);const correction=await stornoResponse.json();\n    const order=orderFor(raw,1,bookingId);\n\n    const rootResponse=await journal(db,cookie,order.id);'''
          new = '''    const stornoResponse=await storno(db,cookie,service.id);const correction=await stornoResponse.json();\n    const order=orderFor(raw,1,bookingId);\n    const appointment=appointmentFor(raw,1,bookingId); assert.ok(appointment?.id>0);\n\n    const rootResponse=await journal(db,cookie,order.id);'''
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old,new)

          old = '''    assert.ok(root.relations.children.some(row=>row.id===payment.documentId&&row.relationType==="based_on"));\n    assert.ok(root.relations.children.some(row=>row.id===service.id&&row.relationType==="based_on"));\n\n    const paymentDetail=await (await journal(db,cookie,payment.documentId)).json();'''
          new = '''    assert.ok(root.relations.children.some(row=>row.id===payment.documentId&&row.relationType==="based_on"));\n    assert.ok(root.relations.children.some(row=>row.id===appointment.id&&row.relationType==="based_on"));\n    assert.ok(!root.relations.children.some(row=>row.id===service.id&&row.relationType==="based_on"));\n\n    const paymentDetail=await (await journal(db,cookie,payment.documentId)).json();'''
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old,new)

          old = '''    const serviceDetail=await (await journal(db,cookie,service.id)).json();\n    assert.ok(serviceDetail.relations.parent.some(row=>row.id===order.id&&row.relationType==="based_on"));\n    assert.ok(serviceDetail.relations.children.some(row=>row.id===correction.document.id&&row.relationType==="storno"));'''
          new = '''    const appointmentDetail=await (await journal(db,cookie,appointment.id)).json();\n    assert.ok(appointmentDetail.relations.parent.some(row=>row.id===order.id&&row.relationType==="based_on"));\n    assert.ok(appointmentDetail.relations.children.some(row=>row.id===service.id&&row.relationType==="based_on"));\n\n    const serviceDetail=await (await journal(db,cookie,service.id)).json();\n    assert.ok(serviceDetail.relations.parent.some(row=>row.id===appointment.id&&row.relationType==="based_on"));\n    assert.ok(serviceDetail.relations.children.some(row=>row.id===correction.document.id&&row.relationType==="storno"));'''
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old,new)
          p.write_text(s)

          # Trigger-only 0097: advance metadata without changing schema shape.
          meta = Path('drizzle/meta')
          journal_path = meta / '_journal.json'
          journal = json.loads(journal_path.read_text())
          last = journal['entries'][-1]
          assert last['idx'] == 96, last
          assert last['tag'] == '0096_booking_cancellation_terminal', last

          source_path = meta / '0096_snapshot.json'
          target_path = meta / '0097_snapshot.json'
          assert not target_path.exists()
          snapshot = json.loads(source_path.read_text())
          previous_id = snapshot['id']
          snapshot['prevId'] = previous_id
          snapshot['id'] = str(uuid.uuid4())
          target_path.write_text(json.dumps(snapshot, ensure_ascii=False, indent=2) + '\n')

          journal['entries'].append({
              'idx': 97,
              'version': last['version'],
              'when': int(time.time() * 1000),
              'tag': '0097_service_delivery_appointment_lineage',
              'breakpoints': True,
          })
          journal_path.write_text(json.dumps(journal, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Commit subject updates
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/appointment-registrar.behavior.test.mjs tests/patient-order-root.behavior.test.mjs drizzle/meta/_journal.json drizzle/meta/0097_snapshot.json
          git diff --cached --quiet && exit 0
          git commit -m "test: adopt appointment execution lineage"
          git push origin HEAD:feature/service-delivery-appointment-lineage
