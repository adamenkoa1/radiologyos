name: Temporary 0104 journal updater

on:
  push:
    branches:
      - audit/protocol-revision-derived-history

permissions:
  contents: write
  statuses: write

jobs:
  journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append 0104 journal entry once
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'drizzle/meta/_journal.json';
          const journal = JSON.parse(fs.readFileSync(path, 'utf8'));
          const tag = '0104_protocol_revision_derived_history';
          if (journal.entries.some((entry) => entry.tag === tag)) process.exit(0);
          journal.entries.push({
            idx: 104,
            version: '6',
            when: 1787174034821,
            tag,
            breakpoints: true,
          });
          fs.writeFileSync(path, `${JSON.stringify(journal, null, 2)}\n`);
          NODE
          if git diff --quiet -- drizzle/meta/_journal.json; then
            echo "0104 journal entry already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drizzle/meta/_journal.json
          git commit -m "Register 0104 protocol revision migration"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Publish temporary run locator
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context="tmp-journal-run-${GITHUB_RUN_ID}" \
            -f description="journal updater run ${GITHUB_RUN_ID}"
