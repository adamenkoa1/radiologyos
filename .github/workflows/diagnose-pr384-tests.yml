name: Diagnose PR384 tests

on:
  push:
    branches: [feature/saved-register-report-views]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies deterministically
        run: npm run install:ci
      - name: Build
        run: npm run build
      - name: Capture full test output
        shell: bash
        run: |
          set +e
          node --experimental-strip-types --test tests/*.test.mjs > pr384-test-output.log 2>&1
          status=$?
          echo "$status" > pr384-test-exit-code.txt
          exit 0
      - name: Upload diagnostic output
        uses: actions/upload-artifact@v4
        with:
          name: pr384-test-output
          path: |
            pr384-test-output.log
            pr384-test-exit-code.txt
          if-no-files-found: error
