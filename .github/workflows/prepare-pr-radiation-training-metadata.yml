name: Prepare radiation training metadata

on:
  push:
    branches:
      - feature/personnel-radiation-training

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/personnel-radiation-training
          fetch-depth: 0
      - name: Prepare 0111 snapshot and journal
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const previous = JSON.parse(fs.readFileSync('drizzle/meta/0110_snapshot.json', 'utf8'));
          const next = structuredClone(previous);
          next.id = 'e47f74f8-2eb9-49e6-b0ae-7d651160c45d';
          next.prevId = previous.id;
          fs.writeFileSync('drizzle/meta/0111_snapshot.json', JSON.stringify(next, null, 2) + '\n');

          const journalPath = 'drizzle/meta/_journal.json';
          const journal = JSON.parse(fs.readFileSync(journalPath, 'utf8'));
          if (!journal.entries.some((entry) => entry.tag === '0111_personnel_radiation_training')) {
            journal.entries.push({
              idx: 111,
              version: '6',
              when: 1787275200000,
              tag: '0111_personnel_radiation_training',
              breakpoints: true,
            });
          }
          fs.writeFileSync(journalPath, JSON.stringify(journal, null, 2) + '\n');
          NODE
      - name: Commit prepared metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drizzle/meta/0111_snapshot.json drizzle/meta/_journal.json
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Add Drizzle metadata for radiation training"
          git push origin HEAD:feature/personnel-radiation-training
