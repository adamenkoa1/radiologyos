name: Temporary protocol history preflight

on:
  push:
    branches:
      - audit/protocol-revision-derived-history

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    name: Validate protocol history branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies deterministically
        run: npm run install:ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm exec tsc -- --noEmit --incremental false
      - name: Build
        run: npm run build
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          node --experimental-strip-types --test tests/*.test.mjs 2>&1 | tee preflight-tests.log
      - name: Upload failed test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-history-preflight-failure
          path: preflight-tests.log
          if-no-files-found: error
      - name: Production release gate
        if: success()
        run: npm run test:production-gate
      - name: Publish temporary run locator
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=success
          if [ "${{ job.status }}" != "success" ]; then state=failure; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="tmp-preflight-run-${GITHUB_RUN_ID}" \
            -f description="protocol history preflight ${GITHUB_RUN_ID}"
