name: Patch study-correction journal context

on:
  push:
    branches: [fix/study-correction-journal-context]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/study-correction-journal-context

      - name: Patch journal projection, UI and regressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          journal = Path('lib/business-document-journal.ts')
          text = journal.read_text(encoding='utf-8')

          before = "COALESCE(o.booking_id,s.booking_id,sp.booking_id,rd.booking_id,c.booking_id,f.booking_id) AS bookingId,"
          after = "COALESCE(o.booking_id,s.booking_id,sp.booking_id,sc.booking_id,rd.booking_id,c.booking_id,f.booking_id) AS bookingId,"
          assert text.count(before) == 1
          text = text.replace(before, after, 1)

          before = "COALESCE(o.patient_id,s.patient_id,sp.patient_id,rd.patient_id,c.patient_id,f.patient_id,'') AS patientId,"
          after = "COALESCE(o.patient_id,s.patient_id,sp.patient_id,sc.patient_id,rd.patient_id,c.patient_id,f.patient_id,'') AS patientId,"
          assert text.count(before) == 1
          text = text.replace(before, after, 1)

          before = "COALESCE(o.service_title,s.service_title,sp.service_title,rd.service_title,c.service_title,b.service,'') AS subject,"
          after = "COALESCE(o.service_title,s.service_title,sp.service_title,sc.service_title,rd.service_title,c.service_title,b.service,'') AS subject,"
          assert text.count(before) == 1
          text = text.replace(before, after, 1)

          before = """  LEFT JOIN service_delivery_details sp
    ON d.document_type='study_performance'
   AND sp.document_id=d.basis_document_id
   AND sp.organization_id=d.organization_id
  LEFT JOIN result_delivery_details rd"""
          after = """  LEFT JOIN service_delivery_details sp
    ON d.document_type='study_performance'
   AND sp.document_id=d.basis_document_id
   AND sp.organization_id=d.organization_id
  LEFT JOIN business_documents scp
    ON d.document_type='study_correction'
   AND scp.id=d.basis_document_id
   AND scp.organization_id=d.organization_id
   AND scp.document_type='study_performance'
  LEFT JOIN service_delivery_details sc
    ON d.document_type='study_correction'
   AND sc.document_id=scp.basis_document_id
   AND sc.organization_id=d.organization_id
  LEFT JOIN result_delivery_details rd"""
          assert text.count(before) == 1
          text = text.replace(before, after, 1)

          before = "b.id=COALESCE(o.booking_id,s.booking_id,sp.booking_id,rd.booking_id,c.booking_id,f.booking_id)`;"
          after = "b.id=COALESCE(o.booking_id,s.booking_id,sp.booking_id,sc.booking_id,rd.booking_id,c.booking_id,f.booking_id)`;"
          assert text.count(before) == 1
          text = text.replace(before, after, 1)
          journal.write_text(text, encoding='utf-8')

          page = Path('app/staff/documents/page.tsx')
          text = page.read_text(encoding='utf-8')
          before = '  study_performance:"Виконання дослідження",result_delivery:"Видача результату",'
          after = '  study_performance:"Виконання дослідження",study_correction:"Сторно дослідження",result_delivery:"Видача результату",'
          assert text.count(before) == 1
          text = text.replace(before, after, 1)
          before = 'const REL_UK:Record<string,string>={storno_of:"Сторно документа",refund_of:"Повернення за оплатою",reversal_of:"Сторно/реверс",storno:"Документ сторно",refund:"Документ повернення",reversal:"Реверс",source:"Підстава",related:"Пов’язаний"};'
          after = 'const REL_UK:Record<string,string>={based_on:"На підставі",storno_of:"Сторно документа",refund_of:"Повернення за оплатою",reversal_of:"Сторно/реверс",storno:"Документ сторно",refund:"Документ повернення",reversal:"Реверс",source:"Підстава",related:"Пов’язаний"};'
          assert text.count(before) == 1
          text = text.replace(before, after, 1)
          page.write_text(text, encoding='utf-8')

          tests = Path('tests/business-document-journal.behavior.test.mjs')
          text = tests.read_text(encoding='utf-8')
          before = """    assert.equal(studyCorrection.state,"posted");
    assert.equal(studyCorrection.relationType,"based_on");
    assert.equal(studyCorrection.sourceDocumentId,performance.id);"""
          after = """    assert.equal(studyCorrection.state,"posted");
    assert.equal(studyCorrection.relationType,"based_on");
    assert.equal(studyCorrection.sourceDocumentId,performance.id);
    assert.equal(studyCorrection.bookingId,seeded.bookingId);
    assert.equal(studyCorrection.bookingCode,"RD-DOC-JOURNAL");
    assert.equal(studyCorrection.patientName,"Journal Patient");
    assert.equal(studyCorrection.patientId,performance.patientId);
    assert.equal(studyCorrection.subject,"КТ ОГК");
    assert.equal(studyCorrection.amount,0);"""
          assert text.count(before) == 1
          text = text.replace(before, after, 1)

          before = """    assert.equal(studyCorrectionDetail.document.state,"posted");
    assert.equal(studyCorrectionDetail.document.number,`КВ-${String(correction.document.id).padStart(6,"0")}`);
    assert.equal(studyCorrectionDetail.movements.corrections.length,1);"""
          after = """    assert.equal(studyCorrectionDetail.document.state,"posted");
    assert.equal(studyCorrectionDetail.document.number,`КВ-${String(correction.document.id).padStart(6,"0")}`);
    assert.equal(studyCorrectionDetail.document.bookingId,seeded.bookingId);
    assert.equal(studyCorrectionDetail.document.bookingCode,"RD-DOC-STRUCT");
    assert.equal(studyCorrectionDetail.document.patientName,"Journal Patient");
    assert.equal(studyCorrectionDetail.document.patientId,performanceDetail.document.patientId);
    assert.equal(studyCorrectionDetail.document.subject,"КТ ОГК");
    assert.equal(studyCorrectionDetail.document.amount,0);
    assert.equal(studyCorrectionDetail.document.sourceDocumentId,performanceRelation.id);
    assert.equal(studyCorrectionDetail.movements.corrections.length,1);"""
          assert text.count(before) == 1
          text = text.replace(before, after, 1)

          before = """    const org1=await seedStaffSession(db,{email:"doc-org1@example.com",role:"registrar",organizationId:1});
    const org2=await seedStaffSession(db,{email:"doc-org2@example.com",role:"registrar",organizationId:2});

    const list1=await journal(db,org1);"""
          after = """    const org1=await seedStaffSession(db,{email:"doc-org1@example.com",role:"registrar",organizationId:1});
    const org2=await seedStaffSession(db,{email:"doc-org2@example.com",role:"registrar",organizationId:2});
    const foreignStorno=await storno(db,org2,foreign.serviceDocumentId);
    assert.equal(foreignStorno.status,201);
    const foreignPerformance=raw.prepare(
      `SELECT id FROM business_documents WHERE organization_id=2 AND document_type='study_performance' AND basis_document_id=? LIMIT 1`,
    ).get(foreign.serviceDocumentId);
    const foreignStudyCorrection=raw.prepare(
      `SELECT id FROM business_documents WHERE organization_id=2 AND document_type='study_correction' AND basis_document_id=? LIMIT 1`,
    ).get(foreignPerformance.id);
    assert.ok(foreignStudyCorrection?.id>0);

    const list1=await journal(db,org1);"""
          assert text.count(before) == 1
          text = text.replace(before, after, 1)

          before = """    assert.equal(body1.documents.some(
      row=>row.journalType==="study_performance" && row.sourceDocumentId===foreign.serviceDocumentId,
    ),false);

    const foreignDetail=await journal(db,org1,foreign.serviceDocumentId);"""
          after = """    assert.equal(body1.documents.some(
      row=>row.journalType==="study_performance" && row.sourceDocumentId===foreign.serviceDocumentId,
    ),false);
    assert.equal(body1.documents.some(row=>row.id===foreignStudyCorrection.id),false);

    const foreignStudyCorrectionDetail=await journal(db,org1,foreignStudyCorrection.id);
    assert.equal(foreignStudyCorrectionDetail.status,404);
    const ownStudyCorrectionDetail=await journal(db,org2,foreignStudyCorrection.id);
    assert.equal(ownStudyCorrectionDetail.status,200);
    const ownStudyCorrection=await ownStudyCorrectionDetail.json();
    assert.equal(ownStudyCorrection.document.bookingId,foreign.bookingId);
    assert.equal(ownStudyCorrection.document.bookingCode,"RD-DOC-ORG2");
    assert.equal(ownStudyCorrection.document.patientName,"Journal Patient");
    assert.equal(ownStudyCorrection.document.subject,"КТ ОГК");
    assert.equal(ownStudyCorrection.document.amount,0);

    const foreignDetail=await journal(db,org1,foreign.serviceDocumentId);"""
          assert text.count(before) == 1
          text = text.replace(before, after, 1)
          tests.write_text(text, encoding='utf-8')
          PY

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/business-document-journal.ts app/staff/documents/page.tsx tests/business-document-journal.behavior.test.mjs
          git commit -m 'fix: show study correction context in journal'
          git push origin HEAD:fix/study-correction-journal-context
