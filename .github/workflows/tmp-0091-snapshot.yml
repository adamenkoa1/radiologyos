name: Temporary 0091 Drizzle snapshot

on:
  push:
    branches:
      - feature/study-performance-operational-ownership

permissions:
  contents: write

jobs:
  snapshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate linked snapshot
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { randomUUID } = require('node:crypto');
          const previous = JSON.parse(fs.readFileSync('drizzle/meta/0090_snapshot.json', 'utf8'));
          const next = { ...previous, id: randomUUID(), prevId: previous.id };
          fs.writeFileSync('drizzle/meta/0091_snapshot.json', JSON.stringify(next, null, 2) + '\n');
          NODE
      - name: Commit snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add drizzle/meta/0091_snapshot.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Generate 0091 Drizzle snapshot'
          git push
