# Generated by radiology-next scripts/export-site.mjs from edge/deploy.yml — edit it there.
# Every push to main (a new snapshot of the site from the department's server) is published to radiologyos.tech.
name: Deploy site to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the snapshot
        run: |
          test -f public/site/index.html
          test -f public/site/price.html
          test -f public/site/military.html
          node -e "for (const f of ['public-services','public-hours']) JSON.parse(require('fs').readFileSync('public/snapshot/api/'+f+'.json','utf8'))"
          node --check worker/index.js
      - name: Deploy
        run: npx --yes wrangler@4 deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
