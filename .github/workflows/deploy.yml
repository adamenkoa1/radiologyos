name: Deploy to Cloudflare

# Manual trigger only — run it from the Actions tab after the two repository
# secrets (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID) are set. The build runs
# on GitHub's Linux runner, so nothing needs to be built locally.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Select DEPLOY only after the production change has been approved
        required: true
        type: choice
        default: CANCEL
        options:
          - CANCEL
          - DEPLOY

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    if: ${{ inputs.confirmation == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build artifact
        run: npm run build

      - name: Record D1 recovery bookmark
        run: npx wrangler d1 time-travel info radiologyos --config wrangler.cloudflare.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify a secure active administrator exists
        run: |
          npx wrangler d1 execute radiologyos --remote --config wrangler.cloudflare.toml --json \
            --command "SELECT COUNT(*) AS secure_admins FROM staff_members WHERE role = 'admin' AND active = 1 AND password_hash NOT IN ('', 'pbkdf2$sha256$100000$DIdGQmQdc8l2yyObk0lw0A==$btlwHhk42m8+m7NJlqXpZXQZYZ5d8gsRfxFMTqw59gc=');" \
            > /tmp/radiologyos-secure-admin.json
          node -e '
            const payload = JSON.parse(require("node:fs").readFileSync("/tmp/radiologyos-secure-admin.json", "utf8"));
            const count = Number(payload?.[0]?.results?.[0]?.secure_admins ?? 0);
            if (count < 1) {
              console.error("Production deploy blocked: create an active administrator with a unique password first.");
              process.exit(1);
            }
          '
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply radiologyos --remote --config wrangler.cloudflare.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker and assets
        run: npx wrangler deploy --config wrangler.cloudflare.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test production
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors https://radiologyos.tech/ > /dev/null
