name: Temporary result-delivery metadata generation

on:
  push:
    branches:
      - feature/result-delivery-registrar
    paths:
      - .github/workflows/generate-result-delivery-metadata.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: feature/result-delivery-registrar

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies deterministically
        run: npm run install:ci

      - name: Add canonical result-delivery table to Drizzle schema
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('db/schema.ts')
          text = path.read_text()
          marker = 'export const servicesDeliveredMovements = sqliteTable("services_delivered_movements", {'
          if 'export const resultDeliveryDetails = sqliteTable("result_delivery_details", {' in text:
              raise SystemExit('resultDeliveryDetails already exists')
          if marker not in text:
              raise SystemExit('schema insertion marker not found')
          block = '''export const resultDeliveryDetails = sqliteTable("result_delivery_details", {
          \torganizationId: integer("organization_id").notNull(),
          \tdocumentId: integer("document_id").primaryKey().notNull(),
          \tbookingId: integer("booking_id").notNull().references(() => bookings.id),
          \tpatientId: text("patient_id").notNull().default(""),
          \tserviceTitle: text("service_title").notNull(),
          \tprotocolNumber: text("protocol_number").notNull(),
          \tprotocolVersion: integer("protocol_version").notNull(),
          \tsignedBy: text("signed_by").notNull(),
          \tsignedAt: text("signed_at").notNull(),
          \tdeliveredBy: text("delivered_by").notNull(),
          \tdeliveredAt: text("delivered_at").notNull(),
          \tcreatedAt: text("created_at").notNull().default(sql`(CURRENT_TIMESTAMP)`),
          },
          table => [
          \tuniqueIndex("result_delivery_booking_unique").on(table.organizationId, table.bookingId),
          \tindex("result_delivery_document_idx").on(table.organizationId, table.documentId),
          \tforeignKey(() => ({
          \t\t\tcolumns: [table.documentId, table.organizationId],
          \t\t\tforeignColumns: [businessDocuments.id, businessDocuments.organizationId],
          \t\t\tname: "result_delivery_details_document_id_organization_id_business_documents_id_organization_id_fk"
          \t\t})),
          \tcheck("result_delivery_details_check_1", sql.raw("`protocol_version` > 0")),
          ]);

          '''
          path.write_text(text.replace(marker, block + marker, 1))
          PY

      - name: Generate migration metadata
        run: |
          npx drizzle-kit generate --name=result_delivery_registrar
          echo '--- generated migration files ---'
          ls -la drizzle/0092_*.sql
          echo '--- generated metadata files ---'
          ls -la drizzle/meta/0092_snapshot.json drizzle/meta/_journal.json

      - name: Commit generated schema and metadata
        run: |
          test -n "$(find drizzle -maxdepth 1 -type f -name '0092_*.sql' -print -quit)"
          test -f drizzle/meta/0092_snapshot.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/schema.ts drizzle/
          git diff --cached --stat
          git commit -m "Generate 0092 result delivery metadata"
          git push origin HEAD:feature/result-delivery-registrar
