name: Temporary 0104 snapshot generator

on:
  push:
    branches:
      - audit/protocol-revision-derived-history

permissions:
  contents: write
  statuses: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate and commit schema-identical 0104 snapshot once
        shell: bash
        run: |
          if [ -f drizzle/meta/0104_snapshot.json ]; then
            echo "0104 snapshot already committed"
            exit 0
          fi
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const source = 'drizzle/meta/0103_snapshot.json';
          const target = 'drizzle/meta/0104_snapshot.json';
          const snapshot = JSON.parse(fs.readFileSync(source, 'utf8'));
          snapshot.prevId = snapshot.id;
          snapshot.id = crypto.randomUUID();
          fs.writeFileSync(target, `${JSON.stringify(snapshot, null, 2)}\n`);
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drizzle/meta/0104_snapshot.json
          git commit -m "Add 0104 Drizzle snapshot metadata"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Publish temporary run locator
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context="tmp-snapshot-run-${GITHUB_RUN_ID}" \
            -f description="snapshot generator run ${GITHUB_RUN_ID}"
