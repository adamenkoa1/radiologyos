name: Build appointment registrar

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    if: github.event.pull_request.head.ref == 'feature/appointment-registrar' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/appointment-registrar
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Patch schema and journal projection
        run: python .github/scripts/build-appointment-registrar.py pre
      - name: Generate 0095 metadata
        run: npm run db:generate
      - name: Finalize registrar, docs and behavioral coverage
        run: python .github/scripts/build-appointment-registrar.py post
      - name: Commit generated appointment block
        shell: bash
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add db/schema.ts drizzle/0095_appointment_registrar.sql drizzle/meta/0095_snapshot.json drizzle/meta/_journal.json lib/business-document-journal.ts docs/appointment-registrar.md tests/appointment-registrar.behavior.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'feat: materialize appointment history'
          git push origin HEAD:feature/appointment-registrar
