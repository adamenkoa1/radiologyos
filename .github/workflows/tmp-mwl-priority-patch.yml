name: Temporary MWL identity priority patch

on:
  push:
    branches:
      - audit/dicom-mwl-patient-identity-priority

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply route patch
        run: python .github/tmp-mwl-priority-patch.py
      - name: Commit route patch
        run: |
          if git diff --quiet -- app/api/staff/imaging/route.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/staff/imaging/route.ts
          git commit -m "Prioritize immutable MWL PatientID for DICOM linking"
          git push
