name: Temporary protocol lifecycle preflight

on:
  push:
    branches:
      - audit/protocol-lifecycle-db-guard

permissions:
  contents: read
  statuses: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: npm
      - name: Expose preflight run id
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context="tmp-protocol-lifecycle-preflight-${GITHUB_RUN_ID}" \
            -f description="Protocol lifecycle preflight running"
      - name: Install dependencies deterministically
        run: npm run install:ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm exec tsc -- --noEmit --incremental false
      - name: Build
        run: npm run build
      - name: Behavioral tests
        shell: bash
        run: |
          set +e
          node --experimental-strip-types --test tests/*.test.mjs 2>&1 | tee preflight-tests.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            failure_context=$(grep -n -B 20 -A 45 "not ok " preflight-tests.log || true)
            if [ -z "$failure_context" ]; then
              failure_context=$(tail -n 200 preflight-tests.log)
            fi
            {
              echo "### Protocol lifecycle preflight failure"
              echo
              echo '```text'
              printf '%s\n' "$failure_context"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            details=$(printf '%s\n' "$failure_context" | tail -n 260 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Behavioral tests failed::$details"
            exit "$status"
          fi
      - name: Upload behavioral failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-lifecycle-preflight-failure
          path: preflight-tests.log
          if-no-files-found: ignore
          retention-days: 1
      - name: Production release gate
        run: npm run test:production-gate
      - name: Mark preflight success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context="tmp-protocol-lifecycle-preflight-${GITHUB_RUN_ID}" \
            -f description="Protocol lifecycle preflight passed"
      - name: Mark preflight failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context="tmp-protocol-lifecycle-preflight-${GITHUB_RUN_ID}" \
            -f description="Protocol lifecycle preflight failed"
