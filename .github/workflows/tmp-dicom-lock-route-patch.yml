name: Temporary DICOM lock route patch

on:
  push:
    branches:
      - audit/dicom-signed-study-link-immutability

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply route patch
        run: python .github/tmp-dicom-lock-route-patch.py
      - name: Commit route patch
        run: |
          if git diff --quiet -- app/api/staff/imaging/route.ts; then
            echo "No route changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/staff/imaging/route.ts
          git commit -m "Return conflict when signed imaging identity is locked"
          git push
