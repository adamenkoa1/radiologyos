# Generated by radiology-next scripts/export-site.mjs from edge/mobile-check.yml — edit it there.
# Weekly check of radiologyos.tech on phones and tablets (iPhone/iPad — WebKit, the engine of Safari; Android — Chrome)
# in GitHub's cloud, so the department's server is not loaded. Results and screenshots go to the branch «mobile-check»;
# the owner's weekly report (Monday 08:00 Kyiv) reads them from there. Nothing is sent through the booking form.
name: Mobile check

on:
  schedule:
    - cron: '30 5 * * 1'   # Monday 05:30 UTC = 07:30/08:30 Kyiv (before the report)
  push:                    # and right after the check itself changes
    branches: [main]
    paths: ['checks/**', '.github/workflows/mobile-check.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.58.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - name: Check the site
        run: |
          mkdir -p /tmp/mc && cp checks/mobile-check.mjs /tmp/mc/
          cd /tmp/mc && printf '{"type":"module"}\n' > package.json
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --no-audit --no-fund --silent playwright@1.58.0
          HOME=/root node mobile-check.mjs --site https://radiologyos.tech --out /tmp/mc/out > /dev/null
          date -u +%Y-%m-%dT%H:%M:%SZ > /tmp/mc/out/checked-at.txt
      - name: Save results to the branch mobile-check
        run: |
          cd /tmp/mc/out
          git init -q && git checkout -q -b mobile-check
          git config user.name "radiologyos mobile check" && git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "mobile check $(cat checked-at.txt)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" mobile-check
