name: Temporary 0093 rebuild generator

on:
  push:
    branches:
      - feature/study-correction-registrar

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies deterministically
        run: npm run install:ci

      - name: Generate D1-safe business document rebuild
        shell: bash
        run: |
          node --experimental-strip-types --input-type=module <<'NODE'
          import { DatabaseSync } from "node:sqlite";
          import { readFileSync, readdirSync, writeFileSync } from "node:fs";

          const migrationPath = "drizzle/0093_study_correction_registrar.sql";
          const marker = "-- 0093 business_documents document-type expansion";
          const db = new DatabaseSync(":memory:");
          db.exec("PRAGMA foreign_keys=ON;");
          for (const file of readdirSync("drizzle").filter((name)=>name.endsWith(".sql")).sort()) {
            const sql = readFileSync(`drizzle/${file}`,"utf8");
            db.exec(sql);
          }

          const table = db.prepare("SELECT sql FROM sqlite_schema WHERE type='table' AND name='business_documents'").get();
          if (!table?.sql) throw new Error("business_documents table SQL missing");
          if (table.sql.includes("'study_correction'")) throw new Error("diagnostic baseline unexpectedly already allows study_correction");

          const objects = db.prepare(
            "SELECT type,name,sql FROM sqlite_schema WHERE tbl_name='business_documents' AND type IN ('index','trigger') AND sql IS NOT NULL ORDER BY type,name"
          ).all();
          if (!objects.length) throw new Error("business_documents attached schema objects missing");

          const tables = db.prepare("SELECT name FROM sqlite_schema WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name").all();
          const destructive = [];
          for (const {name} of tables) {
            const safe = String(name).replaceAll('"','""');
            for (const fk of db.prepare(`PRAGMA foreign_key_list("${safe}")`).all()) {
              if (fk.table === "business_documents" && !["NO ACTION","RESTRICT"].includes(String(fk.on_delete).toUpperCase())) {
                destructive.push({table:name,from:fk.from,onDelete:fk.on_delete,onUpdate:fk.on_update});
              }
            }
          }
          if (destructive.length) throw new Error(`Unsafe inbound business_documents FK actions: ${JSON.stringify(destructive)}`);

          const columns = db.prepare("PRAGMA table_info('business_documents')").all().map((row)=>String(row.name));
          const expectedColumns = [
            "id","organization_id","document_type","number","occurred_at","state","comment","created_by",
            "created_at","posted_by","posted_at","reversed_document_id","basis_document_id",
          ];
          if (JSON.stringify(columns)!==JSON.stringify(expectedColumns)) {
            throw new Error(`Unexpected business_documents columns: ${JSON.stringify(columns)}`);
          }
          db.close();

          let newTableSql = String(table.sql)
            .replace("CREATE TABLE `business_documents`", "CREATE TABLE `__new_business_documents`")
            .replace("'study_performance','result_delivery'", "'study_performance','result_delivery','study_correction'");
          if (!newTableSql.includes("'study_correction'")) throw new Error("Failed to expand document_type CHECK");

          const qcols = columns.map((name)=>`\`${name}\``).join(",");
          const recreate = objects.map((object)=>`${object.sql};\n--> statement-breakpoint`).join("\n");
          const rebuild = `\n\n${marker}\n-- SQLite cannot alter a CHECK constraint in place. D1 file imports are atomic; defer parent-FK\n-- validation until the shadow table has replaced the original and every attached guard/index is restored.\nPRAGMA defer_foreign_keys = ON;\n--> statement-breakpoint\n${newTableSql};\n--> statement-breakpoint\nINSERT INTO \`__new_business_documents\` (${qcols})\nSELECT ${qcols} FROM \`business_documents\`;\n--> statement-breakpoint\nDROP TABLE \`business_documents\`;\n--> statement-breakpoint\nALTER TABLE \`__new_business_documents\` RENAME TO \`business_documents\`;\n--> statement-breakpoint\n${recreate}\n`;

          let migration = readFileSync(migrationPath,"utf8");
          if (migration.includes(marker)) throw new Error("0093 rebuild marker already exists");
          writeFileSync(migrationPath,migration.trimEnd()+rebuild,"utf8");

          const oldTypes = "'study_performance','result_delivery'";
          const newTypes = "'study_performance','result_delivery','study_correction'";
          let schema = readFileSync("db/schema.ts","utf8");
          const schemaMatches = schema.split(oldTypes).length-1;
          if (schemaMatches !== 1) throw new Error(`Expected one schema document-type match, found ${schemaMatches}`);
          schema = schema.replace(oldTypes,newTypes);
          writeFileSync("db/schema.ts",schema,"utf8");

          const snapshotPath = "drizzle/meta/0093_snapshot.json";
          const snapshot = JSON.parse(readFileSync(snapshotPath,"utf8"));
          let rewritten = 0;
          const visit = (value) => {
            if (typeof value === "string") {
              if (value.includes("document_type") && value.includes(oldTypes)) {
                rewritten += 1;
                return value.replace(oldTypes,newTypes);
              }
              return value;
            }
            if (Array.isArray(value)) return value.map(visit);
            if (value && typeof value === "object") {
              for (const key of Object.keys(value)) value[key]=visit(value[key]);
            }
            return value;
          };
          visit(snapshot);
          if (rewritten !== 1) throw new Error(`Expected one 0093 snapshot CHECK rewrite, found ${rewritten}`);
          writeFileSync(snapshotPath,JSON.stringify(snapshot,null,2)+"\n","utf8");

          const transactionBlock = [
            '      if (file === "0093_study_correction_registrar.sql") {',
            '        db.exec("BEGIN;");',
            '        try {',
            '          db.exec(sql);',
            '          db.exec("COMMIT;");',
            '        } catch (migrationError) {',
            '          try { db.exec("ROLLBACK;"); } catch {}',
            '          throw migrationError;',
            '        }',
            '      } else {',
            '        db.exec(sql);',
            '      }',
          ].join("\n");

          for (const path of ["tests/helpers/d1.mjs","tests/migration-upgrade.test.mjs"]) {
            let text=readFileSync(path,"utf8");
            const needle="      db.exec(sql);";
            const count=text.split(needle).length-1;
            if (count !== 1) throw new Error(`Expected one migration exec in ${path}, found ${count}`);
            text=text.replace(needle,transactionBlock);
            writeFileSync(path,text,"utf8");
          }

          console.log(`Generated rebuild with ${objects.length} attached indexes/triggers and ${columns.length} columns.`);
          NODE

      - name: Restore canonical CI and remove temporary workflow
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          rm .github/workflows/tmp-0093-diagnostics.yml

      - name: Commit generated fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drizzle/0093_study_correction_registrar.sql drizzle/meta/0093_snapshot.json db/schema.ts tests/helpers/d1.mjs tests/migration-upgrade.test.mjs .github/workflows/ci.yml .github/workflows/tmp-0093-diagnostics.yml
          git diff --cached --check
          git commit -m "fix: allow physical study correction documents"
          git push origin HEAD:feature/study-correction-registrar
