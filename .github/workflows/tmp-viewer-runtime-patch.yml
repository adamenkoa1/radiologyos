name: Temporary viewer runtime policy patch

on:
  push:
    branches:
      - audit/dicom-viewer-host-policy

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply viewer runtime policy patch
        run: python .github/tmp-viewer-runtime-patch.py
      - name: Commit patch
        run: |
          if git diff --quiet -- app/api/staff/imaging/route.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/staff/imaging/route.ts
          git commit -m "Filter unsafe stored PACS viewer URLs at runtime"
          git push
