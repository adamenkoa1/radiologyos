name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate RadiologyOS
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies deterministically
        run: npm run install:ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm exec tsc -- --noEmit --incremental false

      - name: Build
        run: npm run build

      - name: Diagnose DICOM regressions
        shell: bash
        run: |
          set +e
          failed=0
          for f in \
            tests/dicom-accession.behavior.test.mjs \
            tests/dicom-auto-link-validation.behavior.test.mjs \
            tests/dicom-pacs.test.mjs \
            tests/dicom-study-integrity.behavior.test.mjs
          do
            node --experimental-strip-types --test "$f" >/tmp/dicom-test.log 2>&1
            rc=$?
            if (( rc != 0 )); then
              echo "::error file=$f,title=DICOM regression::$f failed after PACS identity hardening"
              failed=1
            fi
          done
          exit "$failed"

      - name: Tests
        run: node --experimental-strip-types --test tests/*.test.mjs

      - name: Production release gate
        run: npm run test:production-gate
