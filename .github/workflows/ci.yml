name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate RadiologyOS
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies deterministically
        run: npm run install:ci

      - name: Build Drizzle rebaseline artifact
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/drizzle-metadata-rebaseline'
        shell: bash
        run: |
          mkdir -p .drizzle-rebaseline-debug
          set +e
          npm install --no-save better-sqlite3@11.10.0 > .drizzle-rebaseline-debug/install.log 2>&1
          install_status=$?
          if [ "$install_status" -ne 0 ]; then
            cat .drizzle-rebaseline-debug/install.log
            exit "$install_status"
          fi
          node scripts/drizzle-rebaseline-converge.mjs > .drizzle-rebaseline-debug/pull.log 2>&1
          pull_status=$?
          cat .drizzle-rebaseline-debug/pull.log
          exit "$pull_status"

      - name: Upload Drizzle rebaseline artifact
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'fix/drizzle-metadata-rebaseline'
        uses: actions/upload-artifact@v4
        with:
          name: drizzle-rebaseline
          path: |
            .drizzle-rebaseline-artifact
            .drizzle-rebaseline-debug
          include-hidden-files: true
          if-no-files-found: error

      - name: Clean Drizzle rebaseline diagnostics
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'fix/drizzle-metadata-rebaseline'
        run: rm -rf .drizzle-rebaseline-artifact .drizzle-rebaseline-debug

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm exec tsc -- --noEmit --incremental false

      - name: Build
        run: npm run build

      - name: Tests
        shell: bash
        run: |
          set +e
          node --experimental-strip-types --test tests/*.test.mjs 2>&1 | tee test-output.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            failure_context=$(grep -n -B 20 -A 45 "not ok " test-output.log || true)
            if [ -z "$failure_context" ]; then
              failure_context=$(tail -n 160 test-output.log)
            fi
            {
              echo "### Behavioral test failure"
              echo
              echo '```text'
              printf '%s\n' "$failure_context"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            details=$(printf '%s\n' "$failure_context" | tail -n 260 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Behavioral tests failed::$details"
            exit "$status"
          fi

      - name: Production release gate
        run: npm run test:production-gate

      - name: Commit Drizzle rebaseline output
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/drizzle-metadata-rebaseline'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/schema.ts drizzle/meta
          if git diff --cached --quiet; then
            echo "Generated Drizzle baseline is already committed."
            exit 0
          fi
          git commit -m "fix: rebaseline Drizzle schema metadata"
          git push origin "HEAD:${{ github.head_ref }}"
