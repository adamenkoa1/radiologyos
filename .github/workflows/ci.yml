name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate RadiologyOS
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies deterministically
        run: npm run install:ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm exec tsc -- --noEmit --incremental false

      - name: Build
        run: npm run build

      - name: Tests
        shell: bash
        run: |
          set +e
          node --experimental-strip-types --test tests/*.test.mjs 2>&1 | tee test-output.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            failure_context=$(grep -n -B 20 -A 45 "not ok " test-output.log || true)
            if [ -z "$failure_context" ]; then
              failure_context=$(tail -n 160 test-output.log)
            fi
            {
              echo "### Behavioral test failure"
              echo
              echo '```text'
              printf '%s\n' "$failure_context"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            details=$(printf '%s\n' "$failure_context" | tail -n 260 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Behavioral tests failed::$details"
            exit "$status"
          fi

      - name: Upload failing test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pr409-test-output
          path: test-output.log
          if-no-files-found: error
          retention-days: 1

      - name: Production release gate
        run: npm run test:production-gate
