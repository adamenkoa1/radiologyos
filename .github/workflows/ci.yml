name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate RadiologyOS
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies deterministically
        run: npm run install:ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm exec tsc -- --noEmit --incremental false

      - name: Build
        run: npm run build

      - name: Dump temporary business-document schema diagnostics
        shell: bash
        run: |
          node --experimental-strip-types --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          import { freshDb } from "./tests/helpers/d1.mjs";
          const { raw, close } = await freshDb();
          try {
            const table = raw.prepare("SELECT sql FROM sqlite_schema WHERE type='table' AND name='business_documents'").get();
            const objects = raw.prepare("SELECT type,name,tbl_name,sql FROM sqlite_schema WHERE tbl_name='business_documents' AND type IN ('index','trigger') AND sql IS NOT NULL ORDER BY type,name").all();
            const inbound = raw.prepare("SELECT name FROM sqlite_schema WHERE type='table' AND sql LIKE '%REFERENCES `business_documents`%' ORDER BY name").all();
            writeFileSync('business-doc-schema.json', JSON.stringify({ table, objects, inbound }, null, 2));
          } finally {
            close();
          }
          NODE

      - name: Tests
        shell: bash
        run: |
          set +e
          node --experimental-strip-types --test tests/*.test.mjs 2>&1 | tee test-output.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            failure_context=$(grep -n -B 20 -A 45 "not ok " test-output.log || true)
            if [ -z "$failure_context" ]; then
              failure_context=$(tail -n 160 test-output.log)
            fi
            {
              echo "### Behavioral test failure"
              echo
              echo '```text'
              printf '%s\n' "$failure_context"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            details=$(printf '%s\n' "$failure_context" | tail -n 260 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Behavioral tests failed::$details"
            exit "$status"
          fi

      - name: Upload temporary behavioral test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tmp-0093-ci-test-output
          path: |
            test-output.log
            business-doc-schema.json
          if-no-files-found: warn
          retention-days: 1

      - name: Production release gate
        run: npm run test:production-gate
