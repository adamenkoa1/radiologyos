name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate RadiologyOS
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies deterministically
        run: npm run install:ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm exec tsc -- --noEmit --incremental false
      - name: Build application
        run: npm run build
      - name: OTP rotation diagnostic
        id: otp_rotation
        continue-on-error: true
        run: node --experimental-strip-types --test --test-name-pattern="creating a newer OTP" tests/patient-otp.behavior.test.mjs > otp-rotation.log 2>&1
      - name: Upload OTP rotation diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: otp-rotation-log
          path: otp-rotation.log
          retention-days: 1
      - name: Fail on OTP rotation diagnostic
        if: steps.otp_rotation.outcome == 'failure'
        run: exit 1
