name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate RadiologyOS
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies deterministically
        run: npm run install:ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm exec tsc -- --noEmit --incremental false

      - name: Build application
        run: npm run build

      - name: Patient auth and migration tests
        run: node --experimental-strip-types --test tests/patient-otp.behavior.test.mjs tests/patient-identity-migration.behavior.test.mjs

      - name: Shared-phone endpoint tests
        run: node --experimental-strip-types --test tests/patient-identity-scope.behavior.test.mjs tests/my-bookings.behavior.test.mjs tests/booking-cancel.behavior.test.mjs tests/payment-api.behavior.test.mjs tests/booking-code.behavior.test.mjs tests/patient-cabinet-tenant.test.mjs

      - name: Telegram identity tests
        run: node --experimental-strip-types --test tests/telegram-patient.test.mjs

      - name: Patient static security tests
        run: node --experimental-strip-types --test tests/security-hardening.test.mjs tests/site-bridge.test.mjs

      - name: Full test suite
        run: node --experimental-strip-types --test tests/*.test.mjs

      - name: Production release gate
        run: npm run test:production-gate
