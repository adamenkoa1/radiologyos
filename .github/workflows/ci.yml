name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate RadiologyOS
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies deterministically
        run: npm run install:ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm exec tsc -- --noEmit --incremental false

      - name: Full test diagnostic
        id: full_test
        continue-on-error: true
        run: npm test > full-test.log 2>&1

      - name: Upload full test diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-test-log
          path: full-test.log
          retention-days: 1

      - name: Fail on full test diagnostic
        if: steps.full_test.outcome == 'failure'
        run: exit 1
