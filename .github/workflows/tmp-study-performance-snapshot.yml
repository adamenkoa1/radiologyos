name: Temporary study-performance snapshot

on:
  push:
    branches:
      - feature/study-performance-registrar
    paths:
      - .github/workflows/tmp-study-performance-snapshot.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/study-performance-registrar
      - name: Create linked trigger-only snapshot
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const source = 'drizzle/meta/0089_snapshot.json';
          const target = 'drizzle/meta/0090_snapshot.json';
          const snapshot = JSON.parse(fs.readFileSync(source, 'utf8'));
          if (snapshot.id !== '6f9a4c72-b053-47f3-9fdc-78e37f6214ca') {
            throw new Error(`Unexpected 0089 snapshot id: ${snapshot.id}`);
          }
          snapshot.prevId = snapshot.id;
          snapshot.id = '4b646694-d2e7-41ef-b399-192eca308ceb';
          fs.writeFileSync(target, JSON.stringify(snapshot, null, 2) + '\n');
          NODE
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drizzle/meta/0090_snapshot.json
          git commit -m "Link study-performance Drizzle snapshot"
          git push origin HEAD:feature/study-performance-registrar
