name: Verify dispatched production deploy

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  verify:
    name: Verify production deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Locate and verify exact deploy run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: 99a51e37eb951a17baf182f3e845ab3e0b2dfa7e
        run: |
          set -euo pipefail
          run_id=""
          run_url=""
          for _ in $(seq 1 60); do
            row=$(gh run list \
              --repo "${{ github.repository }}" \
              --workflow deploy.yml \
              --branch main \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,headSha,url \
              --jq '.[] | select(.headSha == env.EXPECTED_SHA) | [.databaseId,.url] | @tsv' \
              | head -n 1 || true)
            if [ -n "$row" ]; then
              run_id=$(printf '%s' "$row" | cut -f1)
              run_url=$(printf '%s' "$row" | cut -f2)
              break
            fi
            sleep 5
          done
          if [ -z "$run_id" ]; then
            echo "No workflow_dispatch deploy found for expected SHA $EXPECTED_SHA" >&2
            exit 1
          fi
          echo "Production deploy run: $run_id"
          echo "Production deploy URL: $run_url"
          gh run watch "$run_id" --repo "${{ github.repository }}" --exit-status
          gh run view "$run_id" \
            --repo "${{ github.repository }}" \
            --json databaseId,status,conclusion,headSha,url,workflowName,createdAt,updatedAt
          {
            echo "### Verified production deploy"
            echo "- Run: $run_id"
            echo "- SHA: $EXPECTED_SHA"
            echo "- URL: $run_url"
          } >> "$GITHUB_STEP_SUMMARY"
