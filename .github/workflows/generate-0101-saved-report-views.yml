name: Generate 0101 saved report views

on:
  push:
    branches:
      - feature/saved-register-report-views

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm run install:ci
      - name: Add saved report view schema
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path='db/schema.ts';
          let source=fs.readFileSync(path,'utf8');
          if(source.includes('export const savedReportViews = sqliteTable("saved_report_views"')) process.exit(0);
          source += `\n\nexport const savedReportViews = sqliteTable("saved_report_views", {\n\tid: integer().primaryKey({ autoIncrement: true }).notNull(),\n\torganizationId: integer("organization_id").notNull(),\n\treportKey: text("report_key").notNull().default("register_turnover"),\n\tname: text().notNull(),\n\tconfigurationJson: text("configuration_json").notNull().default("{}"),\n\tcreatedBy: text("created_by").notNull(),\n\tcreatedAt: text("created_at").notNull().default(sql\`(CURRENT_TIMESTAMP)\`),\n\tupdatedBy: text("updated_by").notNull(),\n\tupdatedAt: text("updated_at").notNull().default(sql\`(CURRENT_TIMESTAMP)\`),\n},\ntable => [\n\tuniqueIndex("saved_report_views_org_report_name_unique").on(table.organizationId, table.reportKey, table.name),\n\tindex("saved_report_views_org_report_idx").on(table.organizationId, table.reportKey, table.updatedAt, table.id),\n\tcheck("saved_report_views_report_key_check", sql.raw("\`report_key\` = 'register_turnover'")),\n\tcheck("saved_report_views_name_check", sql.raw("length(trim(\`name\`)) BETWEEN 1 AND 80")),\n]);\n`;
          fs.writeFileSync(path,source);
          NODE
      - name: Generate Drizzle migration metadata
        run: npm run db:generate
      - name: Give migration a stable name
        run: |
          generated=$(find drizzle -maxdepth 1 -type f -name '0101_*.sql' | head -n 1)
          test -n "$generated"
          if [ "$generated" != "drizzle/0101_saved_report_views.sql" ]; then
            mv "$generated" drizzle/0101_saved_report_views.sql
          fi
          node <<'NODE'
          const fs=require('node:fs');
          const path='drizzle/meta/_journal.json';
          const journal=JSON.parse(fs.readFileSync(path,'utf8'));
          const entry=journal.entries.at(-1);
          if(!entry || !String(entry.tag).startsWith('0101_')) throw new Error('Expected 0101 journal entry');
          entry.tag='0101_saved_report_views';
          fs.writeFileSync(path,JSON.stringify(journal,null,2)+'\n');
          NODE
      - name: Commit generated schema and migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add db/schema.ts drizzle/0101_saved_report_views.sql drizzle/meta/_journal.json drizzle/meta/0101_snapshot.json
          git diff --cached --exit-code && exit 0
          git commit -m "feat: add saved report view storage"
          git push
