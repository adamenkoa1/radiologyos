name: Normalize result addendum delivery metadata

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    if: github.event.pull_request.head.ref == 'feature/result-addendum-delivery' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/result-addendum-delivery
      - name: Restore canonical journal formatting
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          path=Path('drizzle/meta/_journal.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2,separators=(',',':'))+'\n',encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add drizzle/meta/_journal.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore: normalize 0094 journal metadata'
          git push origin HEAD:feature/result-addendum-delivery
