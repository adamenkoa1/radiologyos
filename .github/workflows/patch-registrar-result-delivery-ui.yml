name: Patch registrar result delivery UI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'feature/registrar-result-delivery' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/registrar-result-delivery
      - name: Apply UI and RBAC docs patch
        run: python .github/scripts/patch-registrar-result-delivery-ui.py
      - name: Commit patch
        shell: bash
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/staff/studies/page.tsx docs/roles-permissions.md docs/result-delivery-registrar.md
          git diff --cached --quiet && exit 0
          git commit -m 'feat: surface registrar result delivery queue'
          git push origin HEAD:feature/registrar-result-delivery
