name: Refine personnel dosimetry values

on:
  push:
    branches:
      - feature/personnel-dosimetry

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/personnel-dosimetry
          fetch-depth: 0
      - name: Remove arbitrary dose cap and preserve precision
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const apiPath = 'app/api/staff/personnel/dosimetry/route.ts';
          let api = fs.readFileSync(apiPath, 'utf8');
          api = api.replace(
            '  return Number.isFinite(dose) && dose >= 0 && dose <= 100000 ? dose : NaN;',
            '  return Number.isFinite(dose) && dose >= 0 ? dose : NaN;',
          );
          fs.writeFileSync(apiPath, api);

          const pagePath = 'app/staff/personnel/dosimetry/page.tsx';
          let page = fs.readFileSync(pagePath, 'utf8');
          page = page.replace(
            '  return `${Number(value || 0).toFixed(3)} mSv`;',
            '  return `${String(Number(value || 0))} mSv`;',
          );
          page = page.replaceAll(' max="100000" step="0.001"', ' step="any"');
          fs.writeFileSync(pagePath, page);

          const testPath = 'tests/personnel-dosimetry.behavior.test.mjs';
          let test = fs.readFileSync(testPath, 'utf8');
          const apiMarker = '  assert.doesNotMatch(api, /imaging_studies|pacs_settings|bookings|canManageImaging/);\n';
          if (!test.includes('dose <= 100000')) {
            if (!test.includes(apiMarker)) throw new Error('test API marker not found');
            test = test.replace(apiMarker, apiMarker + '  assert.doesNotMatch(api, /dose <= 100000/);\n');
          }
          const pageMarker = '  assert.match(page, /doseDisplay/);\n';
          if (!test.includes('max="100000"')) {
            if (!test.includes(pageMarker)) throw new Error('test page marker not found');
            test = test.replace(pageMarker, pageMarker + '  assert.match(page, /step="any"/);\n  assert.doesNotMatch(page, /max="100000"/);\n');
          }
          fs.writeFileSync(testPath, test);
          NODE
      - name: Commit precision fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/staff/personnel/dosimetry/route.ts app/staff/personnel/dosimetry/page.tsx tests/personnel-dosimetry.behavior.test.mjs
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Preserve dosimetry measurement precision"
          git push origin HEAD:feature/personnel-dosimetry
