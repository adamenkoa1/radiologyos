name: Temporary study-correction metadata

on:
  push:
    branches:
      - feature/study-correction-registrar
    paths:
      - .github/workflows/tmp-study-correction-metadata.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/study-correction-registrar
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate linked metadata and update behavioral contract
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, time, uuid

          root=pathlib.Path('.')
          prev_path=root/'drizzle/meta/0092_snapshot.json'
          next_path=root/'drizzle/meta/0093_snapshot.json'
          snap=json.loads(prev_path.read_text())
          prev_id=snap['id']
          if prev_id!='c4fbd865-2a81-4886-a5a9-157202bb9be8':
              raise SystemExit(f'unexpected 0092 snapshot id: {prev_id}')
          snap['prevId']=prev_id
          snap['id']=str(uuid.uuid4())
          next_path.write_text(json.dumps(snap,ensure_ascii=False,indent=2)+'\n')

          journal_path=root/'drizzle/meta/_journal.json'
          journal=json.loads(journal_path.read_text())
          if journal['entries'][-1]['tag']!='0092_result_delivery_registrar':
              raise SystemExit('unexpected journal tail')
          journal['entries'].append({
              'idx':93,'version':'6','when':int(time.time()*1000),
              'tag':'0093_study_correction_registrar','breakpoints':True,
          })
          journal_path.write_text(json.dumps(journal,ensure_ascii=False,indent=2,separators=(',', ':'))+'\n')

          test_path=root/'tests/study-performance-registrar.behavior.test.mjs'
          text=test_path.read_text()
          old='''    const source=raw.prepare("SELECT state FROM business_documents WHERE id=?").get(before.source.id);\n    const performance=raw.prepare("SELECT state FROM business_documents WHERE id=?").get(before.performance.id);\n    const correction=correctionForSource(raw,1,before.source.id);\n    assert.equal(source.state,"reversed");\n    assert.equal(performance.state,"reversed");\n    assert.equal(correction.state,"posted");\n\n    // Positive history stays immutable on the reversed performance registrar.\n    assert.deepEqual(movementCounts(raw,before.performance.id),{\n      services:1,equipment:1,staff:2,revenue:0,settlements:0,cash:0,\n    });\n    // Economic history stays on service_delivery; the separate correction owns all negative entries.\n    assert.deepEqual(movementCounts(raw,before.source.id),{\n      services:0,equipment:0,staff:0,revenue:1,settlements:1,cash:0,\n    });\n    assert.deepEqual(movementCounts(raw,correction.id),{\n      services:0,equipment:1,staff:2,revenue:1,settlements:1,cash:0,\n    });\n    const serviceCorrection=raw.prepare(\n      `SELECT quantity_delta AS quantityDelta,anatomical_regions_delta AS regionsDelta\n       FROM service_correction_movements WHERE document_id=?`\n    ).get(correction.id);\n    assert.equal(serviceCorrection.quantityDelta,-1);\n    assert.equal(serviceCorrection.regionsDelta,-2);\n    assert.equal(raw.prepare(\n      "SELECT SUM(minutes_delta) AS n FROM equipment_load_movements WHERE document_id=?"\n    ).get(correction.id).n,-30);\n    assert.equal(raw.prepare(\n      "SELECT SUM(units_delta) AS n FROM staff_output_movements WHERE document_id=?"\n    ).get(correction.id).n,-2);'''
          new='''    const source=raw.prepare("SELECT state FROM business_documents WHERE id=?").get(before.source.id);\n    const performance=raw.prepare("SELECT state FROM business_documents WHERE id=?").get(before.performance.id);\n    const correction=correctionForSource(raw,1,before.source.id);\n    const studyCorrection=raw.prepare(\n      `SELECT id,number,state,basis_document_id AS basisDocumentId,reversed_document_id AS reversedDocumentId\n       FROM business_documents\n       WHERE organization_id=1 AND document_type='study_correction' AND basis_document_id=? LIMIT 1`\n    ).get(before.performance.id);\n    assert.equal(source.state,"reversed");\n    assert.equal(performance.state,"reversed");\n    assert.equal(correction.state,"posted");\n    assert.ok(studyCorrection?.id>0);\n    assert.equal(studyCorrection.number,`КВ-${String(correction.id).padStart(6,"0")}`);\n    assert.equal(studyCorrection.basisDocumentId,before.performance.id);\n    assert.equal(studyCorrection.reversedDocumentId,before.performance.id);\n\n    // Positive history stays immutable on the reversed performance registrar.\n    assert.deepEqual(movementCounts(raw,before.performance.id),{\n      services:1,equipment:1,staff:2,revenue:0,settlements:0,cash:0,\n    });\n    // Economic correction owns only revenue/settlement; operational negatives belong to study_correction.\n    assert.deepEqual(movementCounts(raw,before.source.id),{\n      services:0,equipment:0,staff:0,revenue:1,settlements:1,cash:0,\n    });\n    assert.deepEqual(movementCounts(raw,correction.id),{\n      services:0,equipment:0,staff:0,revenue:1,settlements:1,cash:0,\n    });\n    assert.deepEqual(movementCounts(raw,studyCorrection.id),{\n      services:0,equipment:1,staff:2,revenue:0,settlements:0,cash:0,\n    });\n    const serviceCorrection=raw.prepare(\n      `SELECT quantity_delta AS quantityDelta,anatomical_regions_delta AS regionsDelta\n       FROM service_correction_movements WHERE document_id=?`\n    ).get(studyCorrection.id);\n    assert.equal(serviceCorrection.quantityDelta,-1);\n    assert.equal(serviceCorrection.regionsDelta,-2);\n    assert.equal(raw.prepare(\n      "SELECT SUM(minutes_delta) AS n FROM equipment_load_movements WHERE document_id=?"\n    ).get(studyCorrection.id).n,-30);\n    assert.equal(raw.prepare(\n      "SELECT SUM(units_delta) AS n FROM staff_output_movements WHERE document_id=?"\n    ).get(studyCorrection.id).n,-2);'''
          if old not in text:
              raise SystemExit('study-performance storno assertion block not found')
          test_path.write_text(text.replace(old,new,1))

          report_path=root/'lib/register-turnover-report.ts'
          report=report_path.read_text()
          report=report.replace(
              '// Compatibility projection for the canonical studies_performed register. Until the dedicated\n// study_performance registrar owns these facts, performed-study counts are the immutable union\n// of positive service-delivery movements and their explicit storno movements.',
              '// Canonical studies_performed read model. Historical positives may still reference service_delivery,\n// while new positives are owned by study_performance and new operational storno rows by study_correction.\n// The append-only movement union intentionally spans all three eras without rewriting history.'
          )
          report_path.write_text(report)
          PY
      - name: Remove temporary workflow and commit generated files
        shell: bash
        run: |
          git rm .github/workflows/tmp-study-correction-metadata.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drizzle/meta/0093_snapshot.json drizzle/meta/_journal.json tests/study-performance-registrar.behavior.test.mjs lib/register-turnover-report.ts
          git commit -m "Align study-correction metadata and behavior tests"
          git push origin HEAD:feature/study-correction-registrar
