name: Temporary protocol lifecycle fixture fix

on:
  push:
    branches:
      - audit/protocol-lifecycle-db-guard

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Align addendum base protocol fixture
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'tests/protocol-addendum-lifecycle.behavior.test.mjs';
          let text = fs.readFileSync(path, 'utf8');
          const oldFn = `function seedProtocol(raw, bookingId, status = "issued") {
  if (status === "issued") {
    raw.prepare(
      \`INSERT INTO protocols
        (organization_id, booking_id, number, status, version, author_email, updated_by,
         findings, conclusion, signed_by, signed_at, signed_version)
       VALUES (1, ?, 'P-ADD-1', 'issued', 1, 'radiologist@example.com', 'radiologist@example.com',
         'Основний опис', 'Основний висновок', 'radiologist@example.com', CURRENT_TIMESTAMP, 1)\`,
    ).run(bookingId);
  } else {
    raw.prepare(
      \`INSERT INTO protocols
        (organization_id, booking_id, number, status, version, author_email, updated_by,
         findings, conclusion)
       VALUES (1, ?, 'P-DRAFT-1', 'draft', 1, 'radiologist@example.com', 'radiologist@example.com',
         'Чернетка', 'Чернетка')\`,
    ).run(bookingId);
  }
}`;
          const newFn = `function seedProtocol(raw, bookingId, status = "issued") {
  if (status === "issued") {
    raw.prepare(
      \`INSERT INTO protocols
        (organization_id, booking_id, number, status, version, author_email, updated_by,
         findings, conclusion)
       VALUES (1, ?, 'P-ADD-1', 'ready', 1, 'radiologist@example.com', 'radiologist@example.com',
         'Основний опис', 'Основний висновок')\`,
    ).run(bookingId);
    raw.prepare(
      \`UPDATE protocols
       SET status='signed', version=2, updated_by='radiologist@example.com',
           signed_by='radiologist@example.com', signed_at=CURRENT_TIMESTAMP, signed_version=2
       WHERE organization_id=1 AND booking_id=?\`,
    ).run(bookingId);
    raw.prepare(
      "UPDATE protocols SET status='issued', updated_by='registrar@example.com' WHERE organization_id=1 AND booking_id=?",
    ).run(bookingId);
  } else {
    raw.prepare(
      \`INSERT INTO protocols
        (organization_id, booking_id, number, status, version, author_email, updated_by,
         findings, conclusion)
       VALUES (1, ?, 'P-DRAFT-1', 'draft', 1, 'radiologist@example.com', 'radiologist@example.com',
         'Чернетка', 'Чернетка')\`,
    ).run(bookingId);
  }
}`;
          if (text.includes(oldFn)) text = text.replace(oldFn, newFn);
          text = text.replace(
            "VALUES (?, 1, ?, 1, 'Уточнення формулювання', ?, 'draft', 1,",
            "VALUES (?, 1, ?, 2, 'Уточнення формулювання', ?, 'draft', 1,",
          );
          text = text.replace(
            "VALUES ('dddddddddddddddddddddddddddddddd', 1, ?, 1, 'Причина', 'Текст',",
            "VALUES ('dddddddddddddddddddddddddddddddd', 1, ?, 2, 'Причина', 'Текст',",
          );
          fs.writeFileSync(path, text);
          NODE
      - name: Commit fixture change if needed
        run: |
          if git diff --quiet -- tests/protocol-addendum-lifecycle.behavior.test.mjs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/protocol-addendum-lifecycle.behavior.test.mjs
          git commit -m "Make addendum fixtures obey protocol lifecycle"
          git push
