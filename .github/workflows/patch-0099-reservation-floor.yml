name: Patch 0099 reservation floor

on:
  push:
    branches: [feature/service-material-reservations]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Scope reserved-stock guard to active reservations
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('drizzle/0099_service_material_reservations.sql')
          s=p.read_text()
          old="""CREATE TRIGGER `inventory_reserved_stock_floor`\nBEFORE INSERT ON `inventory_movements`\nWHEN NEW.quantity_delta<0 AND NEW.warehouse_id IS NOT NULL\nBEGIN\n"""
          new="""CREATE TRIGGER `inventory_reserved_stock_floor`\nBEFORE INSERT ON `inventory_movements`\nWHEN NEW.quantity_delta<0 AND NEW.warehouse_id IS NOT NULL\n  AND COALESCE((\n    SELECT SUM(r.quantity_delta) FROM `inventory_reservation_movements` r\n    WHERE r.organization_id=NEW.organization_id\n      AND r.warehouse_id=NEW.warehouse_id\n      AND r.item_id=NEW.item_id\n  ),0) > 0.000001\nBEGIN\n"""
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PY
      - name: Commit subject fix and remove helper
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/patch-0099-reservation-floor.yml
          git add drizzle/0099_service_material_reservations.sql
          git commit -m "fix: preserve canonical negative-stock guard without reservations"
          git push
