name: Patch consumption inventory lines

on:
  push:
    branches: [feature/reservation-material-consumption]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Carry reservation link through inventory document service
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('lib/inventory-documents.ts');s=p.read_text()
          replacements=[
            ('  bookingId?: number | null;\n};','  bookingId?: number | null;\n  reservationMovementId?: number | null;\n};'),
            ('  bookingId:number|null;\n};','  bookingId:number|null;\n  reservationMovementId:number|null;\n};'),
            ('            supplier,supplier_counterparty_id AS supplierCounterpartyId,quantity,reason,booking_id AS bookingId\n','            supplier,supplier_counterparty_id AS supplierCounterpartyId,quantity,reason,booking_id AS bookingId,\n            reservation_movement_id AS reservationMovementId\n'),
            ('    reason:string;bookingId:number|null;\n  }> = [];','    reason:string;bookingId:number|null;reservationMovementId:number|null;\n  }> = [];'),
            ('        reason:text(source.reason,500) || "Надходження",bookingId:null,\n','        reason:text(source.reason,500) || "Надходження",bookingId:null,reservationMovementId:null,\n'),
            ('      const bookingId = intOrNull(source.bookingId);\n','      const bookingId = intOrNull(source.bookingId);\n      const reservationMovementId = intOrNull(source.reservationMovementId);\n'),
            ('        supplier:found.supplier,supplierCounterpartyId:found.supplierCounterpartyId,reason,bookingId,\n','        supplier:found.supplier,supplierCounterpartyId:found.supplierCounterpartyId,reason,bookingId,reservationMovementId,\n'),
            ('         lot_number,expires_on,supplier,supplier_counterparty_id,quantity,reason,booking_id)\n       VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)`\n','         lot_number,expires_on,supplier,supplier_counterparty_id,quantity,reason,booking_id,reservation_movement_id)\n       VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)`\n'),
            ('      line.lotNumber,line.expiresOn,line.supplier,line.supplierCounterpartyId,line.quantity,line.reason,line.bookingId,\n','      line.lotNumber,line.expiresOn,line.supplier,line.supplierCounterpartyId,line.quantity,line.reason,line.bookingId,line.reservationMovementId,\n'),
          ]
          for old,new in replacements:
            assert s.count(old)==1,(old,s.count(old))
            s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Commit subject patch and remove helper
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/patch-consumption-inventory-lines.yml
          git add lib/inventory-documents.ts
          git commit -m "feat: carry reservation links through writeoff drafts"
          git push
