name: PR 411 Drizzle metadata helper

on:
  push:
    branches: [fix/material-consumption-current-appointment]

permissions:
  contents: write

jobs:
  metadata:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: fix/material-consumption-current-appointment
          fetch-depth: 0

      - name: Register trigger-only migration metadata
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const crypto=require('node:crypto');
          const tag='0103_material_consumption_current_appointment';
          const journalPath='drizzle/meta/_journal.json';
          const journal=JSON.parse(fs.readFileSync(journalPath,'utf8'));
          if(journal.entries.at(-1)?.tag!==tag){
            journal.entries.push({
              idx:103,
              version:'6',
              when:Date.now(),
              tag,
              breakpoints:true,
            });
            fs.writeFileSync(journalPath,JSON.stringify(journal,null,2)+'\n');
          }
          const target='drizzle/meta/0103_snapshot.json';
          if(!fs.existsSync(target)){
            const previous=JSON.parse(fs.readFileSync('drizzle/meta/0102_snapshot.json','utf8'));
            const next={...previous,id:crypto.randomUUID(),prevId:previous.id};
            fs.writeFileSync(target,JSON.stringify(next,null,2)+'\n');
          }
          NODE

      - name: Commit generated metadata
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add drizzle/meta/_journal.json drizzle/meta/0103_snapshot.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Register migration 0103 Drizzle metadata"
          git push origin HEAD:fix/material-consumption-current-appointment
