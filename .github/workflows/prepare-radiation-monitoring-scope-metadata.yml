name: Prepare radiation monitoring scope metadata

on:
  push:
    branches:
      - feature/personnel-radiation-monitoring-scope

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/personnel-radiation-monitoring-scope
          fetch-depth: 0
      - name: Prepare 0114 snapshot and journal
        run: |
          node <<'NODE'
          const fs = require('fs');
          const previous = JSON.parse(fs.readFileSync('drizzle/meta/0113_snapshot.json', 'utf8'));
          const next = { ...previous, id: '5d1d3bc4-8e34-4505-a1c5-b4239ea00368', prevId: previous.id };
          fs.writeFileSync('drizzle/meta/0114_snapshot.json', JSON.stringify(next, null, 2) + '\n');

          const journalPath = 'drizzle/meta/_journal.json';
          const journal = JSON.parse(fs.readFileSync(journalPath, 'utf8'));
          const tag = '0114_personnel_radiation_monitoring_scope';
          if (!journal.entries.some((entry) => entry.tag === tag)) {
            journal.entries.push({
              idx: 114,
              version: '6',
              when: 1787286000000,
              tag,
              breakpoints: true,
            });
          }
          fs.writeFileSync(journalPath, JSON.stringify(journal, null, 2) + '\n');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drizzle/meta/0114_snapshot.json drizzle/meta/_journal.json
          git commit -m "Add 0114 Drizzle metadata"
          git push origin HEAD:feature/personnel-radiation-monitoring-scope
