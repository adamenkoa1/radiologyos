name: Patch material requirement contract

on:
  push:
    branches: [feature/service-material-reservations]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Add audit labels and remove test helper residue
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('lib/audit.ts');s=p.read_text()
          anchor='  report_exported: "Експортовано звіт",\n'
          assert s.count(anchor)==1
          addition='  service_material_requirement_created: "Створено норму матеріалів",\n  service_material_requirement_deactivated: "Деактивовано норму матеріалів",\n'
          p.write_text(s.replace(anchor,anchor+addition))

          t=Path('tests/service-material-requirements-api.behavior.test.mjs');q=t.read_text()
          residue='''function req(url,cookie,body,method="POST"){\n  return callWorker(jsonRequest(url,body,{method,headers:{cookie}}),globalThis.__RADIOLOGY_DB__);\n}\n'''
          assert q.count(residue)==1
          t.write_text(q.replace(residue,''))
          PY
      - name: Commit subject patch and remove helper
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/patch-material-requirement-contract.yml
          git add lib/audit.ts tests/service-material-requirements-api.behavior.test.mjs
          git commit -m "feat: label material requirement audit events"
          git push
