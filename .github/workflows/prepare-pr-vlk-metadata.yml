name: Prepare VLK PR metadata

on:
  push:
    branches:
      - feature/personnel-vlk-history

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/personnel-vlk-history
          fetch-depth: 0
      - name: Prepare snapshot, journal and small source fixes
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const previous = JSON.parse(fs.readFileSync('drizzle/meta/0108_snapshot.json', 'utf8'));
          const next = structuredClone(previous);
          next.id = '449d54a0-0fa6-498e-80bd-77e5ab645440';
          next.prevId = previous.id;
          fs.writeFileSync('drizzle/meta/0109_snapshot.json', JSON.stringify(next, null, 2) + '\n');

          const journalPath = 'drizzle/meta/_journal.json';
          const journal = JSON.parse(fs.readFileSync(journalPath, 'utf8'));
          if (!journal.entries.some((entry) => entry.tag === '0109_personnel_vlk_history')) {
            journal.entries.push({
              idx: 109,
              version: '6',
              when: 1787268000000,
              tag: '0109_personnel_vlk_history',
              breakpoints: true,
            });
          }
          fs.writeFileSync(journalPath, JSON.stringify(journal, null, 2) + '\n');

          const auditPath = 'lib/audit.ts';
          let audit = fs.readFileSync(auditPath, 'utf8');
          const marker = '  profile_security_update: "Змінено параметри безпеки профілю",\n';
          if (!audit.includes('personnel_vlk_viewed:')) {
            const addition = marker
              + '  personnel_registry_viewed: "Переглянуто кадровий довідник",\n'
              + '  personnel_created: "Створено кадрову картку",\n'
              + '  personnel_updated: "Оновлено кадрову картку",\n'
              + '  personnel_vlk_viewed: "Переглянуто історію ВЛК працівника",\n'
              + '  personnel_vlk_recorded: "Додано рішення ВЛК працівника",\n';
            if (!audit.includes(marker)) throw new Error('audit label insertion marker not found');
            audit = audit.replace(marker, addition);
            fs.writeFileSync(auditPath, audit);
          }

          const pagePath = 'app/staff/personnel/vlk/page.tsx';
          let page = fs.readFileSync(pagePath, 'utf8');
          page = page.replace(
            '    event.preventDefault();\n    if(!personnelId) return;\n    const form=new FormData(event.currentTarget);',
            '    event.preventDefault();\n    if(!personnelId) return;\n    const formElement=event.currentTarget;\n    const form=new FormData(formElement);',
          );
          page = page.replace('      event.currentTarget.reset();', '      formElement.reset();');
          fs.writeFileSync(pagePath, page);
          NODE
      - name: Commit prepared files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drizzle/meta/0109_snapshot.json drizzle/meta/_journal.json lib/audit.ts app/staff/personnel/vlk/page.tsx
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Prepare VLK migration metadata and audit labels"
          git push origin HEAD:feature/personnel-vlk-history
