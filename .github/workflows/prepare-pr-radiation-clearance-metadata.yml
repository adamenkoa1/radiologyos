name: Prepare radiation clearance metadata

on:
  push:
    branches:
      - feature/personnel-radiation-clearance

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/personnel-radiation-clearance
          fetch-depth: 0
      - name: Prepare 0110 snapshot and journal
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const previous = JSON.parse(fs.readFileSync('drizzle/meta/0109_snapshot.json', 'utf8'));
          const next = structuredClone(previous);
          next.id = '7b9b4f17-a0a8-4afa-9f87-1d2f96716525';
          next.prevId = previous.id;
          fs.writeFileSync('drizzle/meta/0110_snapshot.json', JSON.stringify(next, null, 2) + '\n');

          const journalPath = 'drizzle/meta/_journal.json';
          const journal = JSON.parse(fs.readFileSync(journalPath, 'utf8'));
          if (!journal.entries.some((entry) => entry.tag === '0110_personnel_radiation_clearance')) {
            journal.entries.push({
              idx: 110,
              version: '6',
              when: 1787271600000,
              tag: '0110_personnel_radiation_clearance',
              breakpoints: true,
            });
          }
          fs.writeFileSync(journalPath, JSON.stringify(journal, null, 2) + '\n');
          NODE
      - name: Commit prepared metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drizzle/meta/0110_snapshot.json drizzle/meta/_journal.json
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Add Drizzle metadata for radiation clearance"
          git push origin HEAD:feature/personnel-radiation-clearance
