name: Temporary DICOM bounds patch

on:
  push:
    branches:
      - audit/dicom-identifier-bounds

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply DICOM bounds patch
        run: python .github/tmp-dicom-bounds-patch.py
      - name: Commit patch
        run: |
          if git diff --quiet -- lib/dicom.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/dicom.ts
          git commit -m "Reject overlong DICOM and PACS identifiers"
          git push
