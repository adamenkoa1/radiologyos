name: Prepare personnel dosimetry PR

on:
  push:
    branches:
      - feature/personnel-dosimetry

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/personnel-dosimetry
          fetch-depth: 0
      - name: Prepare metadata and consistency guards
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const migrationPath = 'drizzle/0112_personnel_dosimetry.sql';
          let migration = fs.readFileSync(migrationPath, 'utf8');
          const migrationMarker = "  CHECK (hp3_msv >= 0)\n);";
          const migrationReplacement = "  CHECK (hp3_msv >= 0),\n  CHECK (measurement_status IN ('measured', 'other') OR (hp10_msv = 0 AND hp007_msv = 0 AND hp3_msv = 0))\n);";
          if (!migration.includes('measurement_status IN (\'measured\', \'other\') OR')) {
            if (!migration.includes(migrationMarker)) throw new Error('dosimetry migration marker not found');
            migration = migration.replace(migrationMarker, migrationReplacement);
            fs.writeFileSync(migrationPath, migration);
          }

          const apiPath = 'app/api/staff/personnel/dosimetry/route.ts';
          let api = fs.readFileSync(apiPath, 'utf8');
          const apiMarker = '  if (![hp10Msv, hp007Msv, hp3Msv].every(Number.isFinite)) {\n    return Response.json({ error:"Значення дози мають бути невід’ємними числами" }, { status:400 });\n  }\n';
          const apiAddition = apiMarker
            + '  const doseValues = [hp10Msv, hp007Msv, hp3Msv];\n'
            + '  if ((measurementStatus === "missing" || measurementStatus === "below_detection") && doseValues.some((value) => value !== 0)) {\n'
            + '    return Response.json({ error:"Для відсутнього або нижче межі визначення результату числові дози мають бути нульовими" }, { status:400 });\n'
            + '  }\n';
          if (!api.includes('const doseValues = [hp10Msv, hp007Msv, hp3Msv]')) {
            if (!api.includes(apiMarker)) throw new Error('dosimetry API marker not found');
            api = api.replace(apiMarker, apiAddition);
            fs.writeFileSync(apiPath, api);
          }

          const pagePath = 'app/staff/personnel/dosimetry/page.tsx';
          let page = fs.readFileSync(pagePath, 'utf8');
          const pageMarker = 'function dose(value:number){ return Number(value || 0).toFixed(3); }';
          const pageReplacement = 'function doseDisplay(status:string,value:number){\n  if(status==="missing") return "—";\n  if(status==="below_detection") return "< межі визначення";\n  return `${Number(value || 0).toFixed(3)} mSv`;\n}';
          if (!page.includes('function doseDisplay(')) {
            if (!page.includes(pageMarker)) throw new Error('dosimetry page function marker not found');
            page = page.replace(pageMarker, pageReplacement);
            page = page.replace('<td>{dose(record.hp10Msv)} mSv</td>', '<td>{doseDisplay(record.measurementStatus,record.hp10Msv)}</td>');
            page = page.replace('<td>{dose(record.hp007Msv)} mSv</td>', '<td>{doseDisplay(record.measurementStatus,record.hp007Msv)}</td>');
            page = page.replace('<td>{dose(record.hp3Msv)} mSv</td>', '<td>{doseDisplay(record.measurementStatus,record.hp3Msv)}</td>');
            fs.writeFileSync(pagePath, page);
          }

          const auditPath = 'lib/audit.ts';
          let audit = fs.readFileSync(auditPath, 'utf8');
          const auditMarker = '  personnel_radiation_training_recorded: "Додано запис навчання працівника з радіаційної безпеки",\n';
          if (!audit.includes('personnel_dosimetry_viewed:')) {
            if (!audit.includes(auditMarker)) throw new Error('audit marker not found');
            audit = audit.replace(
              auditMarker,
              auditMarker
                + '  personnel_dosimetry_viewed: "Переглянуто індивідуальну дозиметрію працівника",\n'
                + '  personnel_dosimetry_recorded: "Додано результат індивідуальної дозиметрії працівника",\n',
            );
            fs.writeFileSync(auditPath, audit);
          }

          const previous = JSON.parse(fs.readFileSync('drizzle/meta/0111_snapshot.json', 'utf8'));
          const next = structuredClone(previous);
          next.id = 'f61d3b6c-1b04-4a6b-96e3-6f8f668c797d';
          next.prevId = previous.id;
          fs.writeFileSync('drizzle/meta/0112_snapshot.json', JSON.stringify(next, null, 2) + '\n');

          const journalPath = 'drizzle/meta/_journal.json';
          const journal = JSON.parse(fs.readFileSync(journalPath, 'utf8'));
          if (!journal.entries.some((entry) => entry.tag === '0112_personnel_dosimetry')) {
            journal.entries.push({
              idx:112,
              version:'6',
              when:1787278800000,
              tag:'0112_personnel_dosimetry',
              breakpoints:true,
            });
          }
          fs.writeFileSync(journalPath, JSON.stringify(journal, null, 2) + '\n');
          NODE
      - name: Commit prepared files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drizzle/0112_personnel_dosimetry.sql drizzle/meta/0112_snapshot.json drizzle/meta/_journal.json app/api/staff/personnel/dosimetry/route.ts app/staff/personnel/dosimetry/page.tsx lib/audit.ts
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Harden dosimetry consistency and add migration metadata"
          git push origin HEAD:feature/personnel-dosimetry
