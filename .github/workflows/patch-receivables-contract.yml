name: Patch receivables contract

on:
  push:
    branches: [feature/receivables-aging]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/receivables-aging
      - name: Patch canonical register map and navigation
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('lib/business-core.ts'); s=p.read_text()
          replacements={
            'service_delivery: ["services_delivered", "revenue", "patient_settlements", "equipment_load", "staff_output", "studies_performed"],':'service_delivery: ["services_delivered", "revenue", "patient_settlements", "receivables", "equipment_load", "staff_output", "studies_performed"],',
            'payment: ["cash", "patient_settlements"],':'payment: ["cash", "patient_settlements", "receivables"],',
            'refund: ["cash", "patient_settlements"],':'refund: ["cash", "patient_settlements", "receivables"],',
          }
          for old,new in replacements.items():
            assert s.count(old)==1,(old,s.count(old));s=s.replace(old,new)
          p.write_text(s)

          p=Path('tests/business-core.test.mjs'); s=p.read_text()
          old='''  assert.deepEqual(registersForDocument("payment"), ["cash", "patient_settlements"]);\n  assert.deepEqual(registersForDocument("refund"), ["cash", "patient_settlements"]);'''
          new='''  assert.deepEqual(registersForDocument("payment"), ["cash", "patient_settlements", "receivables"]);\n  assert.deepEqual(registersForDocument("refund"), ["cash", "patient_settlements", "receivables"]);'''
          assert s.count(old)==1;s=s.replace(old,new)
          old='''  assert.ok(registersForDocument("service_delivery").includes("revenue"));\n  assert.ok(registersForDocument("service_delivery").includes("equipment_load"));'''
          new='''  assert.ok(registersForDocument("service_delivery").includes("revenue"));\n  assert.ok(registersForDocument("service_delivery").includes("receivables"));\n  assert.ok(registersForDocument("service_delivery").includes("equipment_load"));'''
          assert s.count(old)==1;s=s.replace(old,new)
          p.write_text(s)

          p=Path('app/staff/reports/registers/page.tsx'); s=p.read_text()
          old='''        <button type="button" disabled={loading} onClick={()=>void load()}>{loading?"Формування…":"Сформувати"}</button>\n      </header>'''
          new='''        <button type="button" disabled={loading} onClick={()=>void load()}>{loading?"Формування…":"Сформувати"}</button>\n        <a className="excelButton" href="/staff/reports/receivables">Дебіторська заборгованість</a>\n      </header>'''
          assert s.count(old)==1,s.count(old);s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Commit subject patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/business-core.ts tests/business-core.test.mjs app/staff/reports/registers/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: expose receivables in business core"
          git push origin HEAD:feature/receivables-aging
