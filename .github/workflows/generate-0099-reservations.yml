name: Generate 0099 reservations

on:
  push:
    branches: [feature/service-material-reservations]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm run install:ci
      - name: Add reservation schema
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('db/schema.ts')
          s=p.read_text()
          anchor='export const expenseMovements = sqliteTable("expense_movements", {'
          assert anchor in s
          assert 'export const serviceMaterialRequirements' not in s
          block='''export const serviceMaterialRequirements = sqliteTable("service_material_requirements", {\n\tid: integer().primaryKey({ autoIncrement: true }).notNull(),\n\torganizationId: integer("organization_id").notNull().references(() => organizations.id),\n\tserviceCode: text("service_code").notNull(),\n\titemId: integer("item_id").notNull().references(() => inventoryItems.id),\n\twarehouseId: integer("warehouse_id").notNull().references(() => warehouses.id),\n\tquantity: real().notNull(),\n\tactive: integer().notNull().default(1),\n\tcreatedBy: text("created_by").notNull(),\n\tcreatedAt: text("created_at").notNull().default(sql`(CURRENT_TIMESTAMP)`),\n\tupdatedBy: text("updated_by").notNull(),\n\tupdatedAt: text("updated_at").notNull().default(sql`(CURRENT_TIMESTAMP)`),\n},\ntable => [\n\tindex("service_material_requirements_service_idx").on(table.organizationId, table.serviceCode, table.active, table.id),\n\tuniqueIndex("service_material_requirements_active_unique").on(table.organizationId, table.serviceCode, table.itemId, table.warehouseId).where(sql.raw("`active` = 1")),\n\tcheck("service_material_requirements_check_1", sql.raw("length(trim(`service_code`)) > 0")),\n\tcheck("service_material_requirements_check_2", sql.raw("`quantity` > 0")),\n\tcheck("service_material_requirements_check_3", sql.raw("`active` IN (0,1)")),\n]);\n\nexport const inventoryReservationMovements = sqliteTable("inventory_reservation_movements", {\n\tid: integer().primaryKey({ autoIncrement: true }).notNull(),\n\torganizationId: integer("organization_id").notNull().references(() => organizations.id),\n\tappointmentDocumentId: integer("appointment_document_id").notNull(),\n\tbookingId: integer("booking_id").notNull().references(() => bookings.id),\n\trequirementId: integer("requirement_id").notNull().references(() => serviceMaterialRequirements.id),\n\tserviceCode: text("service_code").notNull(),\n\titemId: integer("item_id").notNull().references(() => inventoryItems.id),\n\twarehouseId: integer("warehouse_id").notNull().references(() => warehouses.id),\n\tmovementType: text("movement_type").notNull(),\n\tquantityDelta: real("quantity_delta").notNull(),\n\tactorEmail: text("actor_email").notNull(),\n\toccurredAt: text("occurred_at").notNull().default(sql`(CURRENT_TIMESTAMP)`),\n},\ntable => [\n\tuniqueIndex("inventory_reservation_exact_movement_unique").on(table.organizationId, table.appointmentDocumentId, table.requirementId, table.movementType),\n\tindex("inventory_reservation_balance_idx").on(table.organizationId, table.warehouseId, table.itemId, table.id),\n\tindex("inventory_reservation_booking_idx").on(table.organizationId, table.bookingId, table.id),\n\tforeignKey(() => ({\n\t\tcolumns: [table.appointmentDocumentId, table.organizationId],\n\t\tforeignColumns: [businessDocuments.id, businessDocuments.organizationId],\n\t\tname: "inventory_reservation_appointment_tenant_fk"\n\t})),\n\tcheck("inventory_reservation_movements_check_1", sql.raw("`movement_type` IN ('reserve','release')")),\n\tcheck("inventory_reservation_movements_check_2", sql.raw("(`movement_type`='reserve' AND `quantity_delta` > 0) OR (`movement_type`='release' AND `quantity_delta` < 0)")),\n]);\n\n'''
          p.write_text(s.replace(anchor,block+anchor))
          PY
      - name: Generate Drizzle migration
        run: npm run db:generate
      - name: Canonicalize 0099 name
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files=list(Path('drizzle').glob('0099_*.sql'))
          assert len(files)==1, files
          target=Path('drizzle/0099_service_material_reservations.sql')
          files[0].rename(target)
          p=Path('drizzle/meta/_journal.json')
          data=json.loads(p.read_text())
          assert data['entries'][-1]['tag'].startswith('0099_')
          data['entries'][-1]['tag']='0099_service_material_reservations'
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit generated schema
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add db/schema.ts drizzle/0099_service_material_reservations.sql drizzle/meta/0099_snapshot.json drizzle/meta/_journal.json
          git commit -m "feat: add service material reservation schema"
          git push
