name: Prepare radiation review policy metadata

on:
  push:
    branches:
      - feature/personnel-radiation-review-policy

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/personnel-radiation-review-policy
          fetch-depth: 0
      - name: Prepare 0113 snapshot and journal
        run: |
          node <<'NODE'
          const fs = require('fs');
          const previous = JSON.parse(fs.readFileSync('drizzle/meta/0112_snapshot.json', 'utf8'));
          const next = {
            ...previous,
            id: 'd8a3f6cc-51bf-4e6d-9d4e-8e7cc08d5f10',
            prevId: previous.id,
          };
          fs.writeFileSync('drizzle/meta/0113_snapshot.json', JSON.stringify(next, null, 2) + '\n');

          const journalPath = 'drizzle/meta/_journal.json';
          const journal = JSON.parse(fs.readFileSync(journalPath, 'utf8'));
          journal.entries = journal.entries.filter((entry) => entry.idx !== 113 && entry.tag !== '0113_personnel_radiation_review_policy');
          journal.entries.push({
            idx: 113,
            version: '6',
            when: 1787282400000,
            tag: '0113_personnel_radiation_review_policy',
            breakpoints: true,
          });
          fs.writeFileSync(journalPath, JSON.stringify(journal, null, 2) + '\n');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drizzle/meta/0113_snapshot.json drizzle/meta/_journal.json
          git commit -m "Sync 0113 radiation review policy metadata"
          git push origin HEAD:feature/personnel-radiation-review-policy
