# radiologyos.tech — public site of the department (snapshot from radiology-next).
# Generated by radiology-next scripts/export-site.mjs from edge/wrangler.toml — edit it there, not here.
# Same Worker name and custom domain as the old application, so a deploy simply replaces it (nothing to set up in
# Cloudflare). The old application stays in the GitHub branch legacy-app; its D1 database and R2 bucket are kept.
name = "radiologyos"
main = "worker/index.js"
compatibility_date = "2026-03-24"
workers_dev = false

routes = [
  { pattern = "radiologyos.tech", custom_domain = true },
]

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

# Live booking parts (free hours, saving a request in the CRM, visit statistics) and the staff cabinet go to the
# department server through its Cloudflare Tunnel (radiologyos-crm, /opt/ai-project/cloudflared in the VM).
# Without ORIGIN the site still works: booking by messenger, the cabinet only inside the network.
[vars]
ORIGIN = "https://crm.radiologyos.tech"
