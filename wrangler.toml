# radiologyos.tech — public site of the department (snapshot from radiology-next).
# Generated by radiology-next scripts/export-site.mjs from edge/wrangler.toml — edit it there, not here.
# Same Worker name and custom domain as the old application, so a deploy simply replaces it (nothing to set up in
# Cloudflare). The old application stays in the GitHub branch legacy-app; its D1 database and R2 bucket are kept.
name = "radiologyos"
main = "worker/index.js"
compatibility_date = "2026-03-24"
workers_dev = false

routes = [
  { pattern = "radiologyos.tech", custom_domain = true },
]

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

# Live parts (free hours, saving a request in the CRM, visit statistics) need the department's server reachable
# from the internet. Not set up (owner's choice, 10.11.2026): the site answers «offline» and the booking form sends the
# request by messenger. To turn them on later: a public address of the server's gate (edge/gate.mjs), e.g.
# [vars]
# ORIGIN = "https://origin.radiologyos.tech"
