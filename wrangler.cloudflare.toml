# Standalone Cloudflare Workers deployment — runs RadiologyOS on your own
# Cloudflare account and domain, independent of the OpenAI Sites platform.
#
# This file is intentionally NOT named `wrangler.toml` so it does not interfere
# with the existing dev/build toolchain. Deploy with:
#   bash scripts/deploy-cloudflare.sh
# See HOSTING.md for the full walkthrough.

name = "radiologyos"
main = "dist/server/index.js"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# Custom domains. The radiologyos.tech zone is already on Cloudflare (its
# nameservers point to Cloudflare), so `wrangler deploy` provisions these
# domains and their TLS certificates automatically — no manual DNS needed.
routes = [
  { pattern = "radiologyos.tech", custom_domain = true },
  { pattern = "www.radiologyos.tech", custom_domain = true },
]

# Cron-тригер планових нагадувань пацієнтам (за N годин до візиту). Кожні
# 15 хв worker.scheduled перевіряє записи на сьогодні й надсилає WhatsApp.
# Доступно на безкоштовному плані Cloudflare Workers.
[triggers]
crons = ["*/15 * * * *"]

# Static client bundle (JS/CSS, self-hosted fonts, favicon). Served directly by
# Cloudflare; the Worker handles every dynamic / server-rendered route.
[assets]
directory = "dist/client"
binding = "ASSETS"

# D1 database. Create it once (see HOSTING.md) and paste its id below.
[[d1_databases]]
binding = "DB"
database_name = "radiologyos"
database_id = "dc9997c2-7157-42e8-b7f0-2d05654b261c"
migrations_dir = "drizzle"

# Cloudflare Images binding — powers the /_vinext/image optimizer. Left OUT
# because Images is a paid product not available on the Free plan (the app
# does not use next/image, so nothing requests /_vinext/image). If you later
# enable Images, uncomment:
# [images]
# binding = "IMAGES"
