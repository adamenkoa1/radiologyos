# Standalone Cloudflare Workers deployment — runs RadiologyOS on your own
# Cloudflare account and domain, independent of the OpenAI Sites platform.
#
# This file is intentionally NOT named `wrangler.toml` so it does not interfere
# with the existing dev/build toolchain. Deploy with:
#   bash scripts/deploy-cloudflare.sh
# See HOSTING.md for the full walkthrough.

name = "radiologyos"
main = "dist/server/index.js"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

# Custom domain. Keep routes at the TOML top level: placing this key after a
# table header such as [triggers] would make it part of that table.
# The Worker is bound only to the apex hostname. `www` is handled separately
# by Cloudflare redirect/DNS configuration to avoid competing custom domains.
routes = [
  { pattern = "radiologyos.tech", custom_domain = true },
]

# Patient reminders are evaluated every 15 minutes. The handler itself remains
# a no-op unless reminders and WhatsApp are enabled in department settings.
[triggers]
crons = ["*/15 * * * *"]

# Static client bundle (JS/CSS, self-hosted fonts, favicon). The Worker must run
# before asset matching so canonical redirects, security headers and access
# rules apply consistently even to paths backed by HTML assets (for example
# /site/ -> /site/index.html). The Worker explicitly delegates asset delivery
# through env.ASSETS.fetch where appropriate.
[assets]
directory = "dist/client"
binding = "ASSETS"
run_worker_first = true

# D1 database. Create it once (see HOSTING.md) and paste its id below.
[[d1_databases]]
binding = "DB"
database_name = "radiologyos"
database_id = "9013ef37-c262-409b-b15e-235e0899313e"
migrations_dir = "drizzle"

# Cloudflare Images binding — powers the /_vinext/image optimizer. Left OUT
# because Images is a paid product not available on the Free plan (the app
# does not use next/image, so nothing requests /_vinext/image). If you later
# enable Images, uncomment:
# [images]
# binding = "IMAGES"
